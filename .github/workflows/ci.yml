name: Django CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # We use a Postgres service inside Github Actions to run tests
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: ecommerce_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8  # For linting

    - name: Run Linter (Code Style)
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Tests
      env:
        # Mock environment variables for CI
        SECRET_KEY: "ci-test-key"
        DEBUG: "False"
        DATABASE_URL: "postgres://postgres:password@localhost:5432/ecommerce_test_db"
        ALLOWED_HOSTS: "localhost"
      run: |
        python manage.py test
